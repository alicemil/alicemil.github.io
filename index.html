<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>123456group-a | Yapay Zeka Test Ekranı</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 500px; text-align: center; }
        button { background: #00bcd4; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        button:hover { background: #0097a7; }
        input { padding: 10px; width: 80%; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: white; margin-top: 10px; }
        #chat-box { height: 250px; border: 1px solid #333; overflow-y: scroll; padding: 10px; margin-bottom: 15px; background: #181818; text-align: left; border-radius: 6px; }
        .hidden { display: none; }
        .error { color: #ff5252; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- 1. Aşama: Test Uyarısı Ekranı -->
    <div id="warning-screen" class="card">
        <h2>⚠️ Uyarı</h2>
        <p>Yapay zeka testleri yapılmaktadır.</p>
        <button onclick="showPasswordScreen()">Tamam</button>
    </div>

    <!-- 2. Aşama: Şifre Giriş Ekranı -->
    <div id="password-screen" class="card hidden">
        <h2>🔒 Güvenlik Doğrulaması</h2>
        <p>Lütfen erişim şifresini girin:</p>
        <input type="password" id="password-input" placeholder="Şifre">
        <div id="error-msg" class="error"></div>
        <br>
        <button onclick="checkPassword()">Giriş Yap</button>
    </div>

    <!-- 3. Aşama: Yapay Zeka Sohbet Ekranı -->
    <div id="chat-screen" class="card hidden" style="max-width: 600px;">
        <h3>123456group-a AI Asistan</h3>
        <div id="chat-box"></div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="user-input" placeholder="Bir şeyler yazın..." style="margin-top:0; flex:1;">
            <button onclick="sendMessage()" style="margin-top:0;">Gönder</button>
        </div>
    </div>

    <script>
        // API anahtarınızı güvenli şekilde kullanmak için buraya ekleyebilir veya 
        // tarayıcı konsolundan/lokal testlerinizde tanımlayabilirsiniz.
        const API_KEY = ""; 
        
        // '1453' şifresinin güvenli hash karşılığı
        const correctPasswordHash = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function showPasswordScreen() {
            document.getElementById('warning-screen').classList.add('hidden');
            document.getElementById('password-screen').classList.remove('hidden');
        }

        async function checkPassword() {
            const inputVal = document.getElementById('password-input').value;
            const hashedInput = await sha256(inputVal);

            if (hashedInput === correctPasswordHash) {
                document.getElementById('password-screen').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');
            } else {
                document.getElementById('error-msg').innerText = "Hatalı şifre!";
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const message = inputField.value;
            if (!message) return;

            if (!API_KEY) {
                chatBox.innerHTML += `<div style="margin-bottom:8px; color:#ff5252;"><b>Sistem:</b> API anahtarı tanımlanmamış.</div>`;
                return;
            }

            chatBox.innerHTML += `<div style="margin-bottom:8px;"><b>Sen:</b> ${message}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: message }] }]
                    })
                });

                const data = await response.json();
                const aiReply = data.candidates[0].content.parts[0].text;
                chatBox.innerHTML += `<div style="margin-bottom:8px; color:#00bcd4;"><b>AI:</b> ${aiReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<div style="margin-bottom:8px; color:#ff5252;"><b>Sistem:</b> Bir hata oluştu.</div>`;
            }
        }
    </script>
</body>
</html>
