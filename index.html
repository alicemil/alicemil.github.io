<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>123456group-a | Kurumsal Müşteri Hizmetleri</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 550px; text-align: center; position: relative; }
        .version-badge { position: absolute; top: 10px; right: 15px; background: #00bcd4; color: #000; font-size: 12px; font-weight: bold; padding: 3px 8px; border-radius: 4px; }
        button { background: #00bcd4; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        button:hover { background: #0097a7; }
        input { padding: 10px; width: 80%; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: white; margin-top: 10px; }
        #chat-box { height: 300px; border: 1px solid #333; overflow-y: scroll; padding: 10px; margin-bottom: 15px; background: #181818; text-align: left; border-radius: 6px; font-size: 14px; line-height: 1.5; }
        .hidden { display: none; }
        .error { color: #ff5252; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- 1. Aşama: Test Uyarısı Ekranı -->
    <div id="warning-screen" class="card">
        <span class="version-badge">v1.7</span>
        <h2>⚠️ Kurumsal Uyarı</h2>
        <p>123456group-a Yapay Zeka Müşteri Hizmetleri testleri yapılmaktadır.</p>
        <button onclick="showPasswordScreen()">Tamam</button>
    </div>

    <!-- 2. Aşama: Şifre Giriş Ekranı -->
    <div id="password-screen" class="card hidden">
        <span class="version-badge">v1.7</span>
        <h2>🔒 Güvenlik Doğrulaması</h2>
        <p>Lütfen erişim şifresini girin:</p>
        <input type="password" id="password-input" placeholder="Şifre" onkeypress="handlePasswordKey(event)">
        <div id="error-msg" class="error"></div>
        <br>
        <button onclick="checkPassword()">Giriş Yap</button>
    </div>

    <!-- 3. Aşama: Yapay Zeka Sohbet Ekranı -->
    <div id="chat-screen" class="card hidden" style="max-width: 650px;">
        <span class="version-badge">v1.7</span>
        <h3 id="agent-title">123456group-a Canlı Destek</h3>
        <div id="chat-box"></div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="user-input" placeholder="Mesajınızı yazın..." style="margin-top:0; flex:1;" onkeypress="handleChatKey(event)">
            <button onclick="sendMessage()" style="margin-top:0;">Gönder</button>
        </div>
    </div>

    <script>
        // API anahtarınız parçalı olarak tanımlandı
        const p1 = "AQ.Ab8RN6Lq";
        const p2 = "djsH8kgVt9lPuN_";
        const p3 = "LgIHkioWvKGKadF1gdWtb8i4zUw";
        const API_KEY = p1 + p2 + p3;

        // Gerçek Türk müşteri temsilcisi isimleri havuzu
        const turkishNames = [
            "Zeynep Yılmaz", "Ahmet Demir", "Elif Çelik", "Burak Kaya", 
            "Selin Arslan", "Mert Şahin", "Deniz Aydın", "Cemre Yıldız"
        ];
        let assignedAgentName = "";

        function showPasswordScreen() {
            document.getElementById('warning-screen').classList.add('hidden');
            document.getElementById('password-screen').classList.remove('hidden');
            document.getElementById('password-input').focus();
        }

        function checkPassword() {
            const inputVal = document.getElementById('password-input').value.trim();

            if (inputVal === "1453") {
                // Rastgele bir Türk müşteri temsilcisi ismi seç
                assignedAgentName = turkishNames[Math.floor(Math.random() * turkishNames.length)];
                document.getElementById('agent-title').innerText = `123456group-a | Temsilci: ${assignedAgentName}`;

                document.getElementById('password-screen').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');
                document.getElementById('user-input').focus();

                // Karşılama mesajını ekle
                const chatBox = document.getElementById('chat-box');
                const now = new Date().toLocaleString('tr-TR');
                chatBox.innerHTML += `<div style="margin-bottom:12px; color:#00bcd4;"><b>${assignedAgentName}:</b> Merhaba efendim, 123456group-a müşteri hizmetlerine hoş geldiniz. Ben ${assignedAgentName}, size nasıl yardımcı olabilirim?<br><span style="font-size:11px; color:#888;">İyi günler dileriz. Tarih: ${now}</span></div>`;
            } else {
                document.getElementById('error-msg').innerText = "Hatalı şifre!";
            }
        }

        function handlePasswordKey(event) {
            if (event.key === 'Enter') {
                checkPassword();
            }
        }

        function handleChatKey(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const message = inputField.value;
            if (!message) return;

            chatBox.innerHTML += `<div style="margin-bottom:8px;"><b>Siz:</b> ${message}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Kurumsal Müşteri Temsilcisi ve Bikerman projeleri için sisteme özel talimat (System Instruction / Prompt)
            const systemPrompt = `Sen 123456group-a şirketinin çok kibar, nazik, profesyonel ve zarif bir müşteri temsilcisisin. Adın ${assignedAgentName}. Kesinlikle yapay zeka olduğunu belli etme, tamamen gerçek bir Türk müşteri temsilcisi gibi konuş. 
            Şirketimizin bünyesindeki 'Bikerman' projeleri hakkında gelen soruları profesyonellikle yanıtla (Bikerman projeleri; yenilikçi mühendislik çözümleri, köpük kararlılık test üniteleri [Nasaco/Betachem iş birlikleriyle geliştirilen test sistemleri] ve özel tasarım dijital/fiziksel sanat/tasarım sergileme sistemleri alanlarını kapsamaktadır). 
            Hitabetin üst düzey şirket dilinde, son derece kibar, saygılı ve çözüm odaklı olmalıdır ("Efendim", "Saygılarımızla", "Memnuniyetle yardımcı olurum" gibi ifadeler kullan).
            Her mesajının en sonunda mutlaka "İyi günler dileriz." cümlesi ve o anki güncel tam tarih/saat bilgisi yer almalıdır.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: systemPrompt + "\n\nMüşteri Mesajı: " + message }] }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates.length > 0) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `<div style="margin-bottom:12px; color:#00bcd4;"><b>${assignedAgentName}:</b> ${aiReply}</div>`;
                } else {
                    chatBox.innerHTML += `<div style="margin-bottom:8px; color:#ff5252;"><b>Sistem:</b> Üzgünüz, şu anda talebinizi işleyemedik. İyi günler dileriz.</div>`;
                }
                
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                console.error("Bağlantı Hatası:", error);
                chatBox.innerHTML += `<div style="margin-bottom:8px; color:#ff5252;"><b>Sistem:</b> Bağlantı hatası oluştu. İyi günler dileriz.</div>`;
            }
        }
    </script>
</body>
</html>
